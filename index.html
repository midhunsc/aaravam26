<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MMC Fine arts results</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Algreya:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="collegelogo.png" type="image/png">
</head>



<body>

  <header class="fest-header">
  <div class="header-content">
    <img src="collegelogo.svg" alt="College Logo" class="college-logo">

    <div class="header-text">
      <h1 class="college-name">Mary Matha Arts & Science College</h1>
      <h2 class="fest-name">Mananthavady</h2>
    </div>
  </div>
</header>

<div class="container my-5">
<h3 class="section-title events animated-header">ആരവം 2026</h3>
  <!-- SCOREBOARD -->
<section class="section scoreboard-section">
  <div class="scoreboard-header">
  <h3 class="section-title scoreboard">Scoreboard</h3>

  <div class="scoreboard-meta">
    <span class="live-badge">
      <span class="live-dot"></span> LIVE
    </span>
    <div id="lastUpdated" class="last-updated"></div>
  </div>
</div>


  <div class="table-wrapper">
    <table class="score-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Department</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody id="scoreboard"></tbody>
    </table>
  </div>

  
</section>




  <!-- EVENTS -->
  <section class="section">

  <div class="event-search">
      <input
        type="text"
        id="eventSearch"
        placeholder="🔍 Search event / student / department..."
      >
  </div>

  <h3 class="section-title events">Event Results</h3>

  <div class="row g-4" id="events"></div>
<div id="noResults" class="no-results" style="display:none;">
  No results found
</div>

  <div class="text-center mt-4">
    <button id="viewMoreBtn" class="btn btn-outline-primary me-2">
      View More
    </button>
    <button id="viewLessBtn" class="btn btn-outline-secondary">
      View Less
    </button>
  </div>

</section>


</div>

<footer class="site-footer">
  <p>Designed, Developed and Maintained by IT Club MMC</p>
</footer>

<script src="script.js"></script>
</body>
</html>
