<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fine Arts Festival Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Algreya:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;700&display=swap" rel="stylesheet">

</head>

<header class="fest-header">
  <div class="header-content">
    <img src="collegelogo.svg" alt="College Logo" class="college-logo">

    <div class="header-text">
      <h1 class="college-name">Mary Matha Arts & Science College</h1>
      <h2 class="fest-name">Mananthavady</h2>
    </div>
  </div>
</header>

<body>

<div class="container my-5">
<h3 class="section-title events animated-header">ആരവം 2026</h3>
  <!-- SCOREBOARD -->
<section class="section scoreboard-section">
  <h3 class="section-title scoreboard">Department Scoreboard</h3>
<div id="lastUpdated" class="last-updated"></div>
  <div class="table-wrapper">
    <table class="score-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Department</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody id="scoreboard"></tbody>
    </table>
  </div>

  
</section>

  <!-- EVENTS -->
  <section class="section">
  <h3 class="section-title events">Event Results</h3>

  <div class="row g-4" id="events"></div>

  <div class="text-center mt-4">
    <button id="viewMoreBtn" class="btn btn-outline-primary me-2">
      View More
    </button>
    <button id="viewLessBtn" class="btn btn-outline-secondary">
      View Less
    </button>
  </div>
</section>


</div>

<script src="script.js"></script>
</body>
</html>
